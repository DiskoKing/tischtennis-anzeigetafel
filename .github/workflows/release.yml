name: Release
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest -v test_v2 test_windows_launcher test_updater
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          python tools/build_linux.py dist/anzeigetafel-linux.tar.gz
          python tools/build_update.py dist/anzeigetafel-update.zip
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python platform/windows/build_windows.py build/Anzeigetafel-Windows-USB
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Anzeigetafel-Windows-USB -DestinationPath dist/anzeigetafel-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Anzeigetafel $tag" --notes-file RELEASE-NOTES.md
          fi
